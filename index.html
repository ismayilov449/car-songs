<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Songs</title>
<meta name="description" content="The songs on the car USB stick: search, browse, count Next/Back presses and recognise the playing song.">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Car Songs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a phone app — frosted top bar (title, listen button, playing track, search, filters), a listening card,
   one scrolling inset-grouped list per tab, a fixed bottom tab bar and a bottom sheet with song details. */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --sunk:#e5e7eb; --ink:#14181e; --muted:#5d6572; --line:#dde0e6;
  --accent:#9c5a00; --focus:#1f5fa8; --bar:rgba(242,243,245,.86); --shadow:0 -10px 30px rgba(20,24,30,.14); --bad:#b3261e;
  --c-AZ:#1f5fa8; --c-AZRAP:#b3261e; --c-TRRAP:#6b3fa0; --c-TR:#0f7a6d; --c-FR:#a85400; --c-PN:#4a5568;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  --f-lcd:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  --tab-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f13; --surface:#161a20; --sunk:#222831; --ink:#e9ecf1; --muted:#98a1af; --line:#272d36;
  --accent:#f2a93b; --focus:#6aa5ee; --bar:rgba(12,15,19,.82); --shadow:0 -10px 30px rgba(0,0,0,.55); --bad:#f07a72;
  --c-AZ:#6aa5ee; --c-AZRAP:#f07a72; --c-TRRAP:#b493e2; --c-TR:#4cc2b0; --c-FR:#f0a457; --c-PN:#a8b4c6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0f13; --surface:#161a20; --sunk:#222831; --ink:#e9ecf1; --muted:#98a1af; --line:#272d36;
  --accent:#f2a93b; --focus:#6aa5ee; --bar:rgba(12,15,19,.82); --shadow:0 -10px 30px rgba(0,0,0,.55); --bad:#f07a72;
  --c-AZ:#6aa5ee; --c-AZRAP:#f07a72; --c-TRRAP:#b493e2; --c-TR:#4cc2b0; --c-FR:#f0a457; --c-PN:#a8b4c6;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:720px;margin:0 auto}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.appbar .inner{display:grid;gap:10px;padding-block:12px 10px}
.titlerow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 8px}
.titlerow h1{font-family:var(--f-display);font-weight:700;font-size:2.15rem;line-height:1;margin:0;letter-spacing:.01em}
.count{margin-left:auto;font-size:.9rem;color:var(--muted);white-space:nowrap}
.count b{font-family:var(--f-lcd);font-weight:400;color:var(--accent);font-size:1rem}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:42px;font:400 17px var(--f-body);color:var(--ink);background:var(--sunk);border:0;
  border-radius:12px;padding:0 42px 0 37px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;
  background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:50%}
.search .clear svg{position:static;transform:none;width:18px;height:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 4px 0 12px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--surface));
  font-size:14px;font-weight:600;cursor:pointer}
.pill .code{font-family:var(--f-display);letter-spacing:.04em;color:var(--c)}
.pill .x{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.pill .x svg{width:14px;height:14px}

main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px)}
.view{padding-top:6px}
.group{margin-top:14px}
.sec{--c:var(--muted);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h,120px));z-index:10;
  background:var(--bg);display:flex;align-items:baseline;gap:8px;margin:0;padding:10px 4px 6px;font-size:.8rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sec .code{font-family:var(--f-display);font-size:.85rem;letter-spacing:.05em;color:var(--bg);background:var(--c);padding:1px 7px;border-radius:4px}
.sec .name{color:var(--c);font-weight:700}
.sec .rng{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.sec .rng b{font-family:var(--f-lcd);font-weight:400}
.card{background:var(--surface);border-radius:14px;overflow:hidden}

.row{--c:var(--muted);display:grid;grid-template-columns:52px minmax(0,1fr) auto 14px;align-items:center;gap:12px;width:100%;
  min-height:60px;padding:9px 14px 9px 6px;border:0;background:none;text-align:left;cursor:pointer;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:1px solid var(--line)}
.row:active{background:var(--sunk)}
.trk{font-family:var(--f-lcd);font-size:1.5rem;line-height:1;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.txt{min-width:0;display:grid;gap:2px}
.t1{font-size:16.5px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.t2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2 .file{font-family:var(--f-lcd);font-size:13px;color:var(--c)}
.chev{width:14px;height:14px;color:var(--muted);opacity:.7}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cat{--c:var(--muted);display:grid;gap:4px;align-content:start;text-align:left;min-height:112px;padding:14px;border:0;border-radius:16px;
  background:var(--surface);cursor:pointer;position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.cat:active{background:var(--sunk)}
.cat .code{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.05em;color:var(--c)}
.cat .name{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.05}
.cat .info{font-size:.85rem;color:var(--muted)}
.cat .info b{font-family:var(--f-lcd);font-weight:400;color:var(--accent);font-size:.95rem}
.cat.all{grid-column:1 / -1;min-height:auto;grid-template-columns:1fr auto;align-items:center}
.cat.all::before{background:linear-gradient(90deg,var(--c-AZ) 0 17%,var(--c-AZRAP) 17% 33%,var(--c-TRRAP) 33% 50%,var(--c-TR) 50% 67%,var(--c-FR) 67% 83%,var(--c-PN) 83%)}
.about{margin-top:22px;padding:16px;border-radius:16px;background:var(--surface);display:grid;gap:12px;font-size:.92rem;color:var(--muted)}
.about h3{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.about p{margin:0;max-width:62ch}
.about .file{font-family:var(--f-lcd);color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink);font-weight:600;cursor:pointer}
.switch input{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:999px;background:var(--sunk);position:relative;
  cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}

.arow{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:10px;width:100%;min-height:52px;
  padding:8px 14px;border:0;background:none;text-align:left;cursor:pointer;position:relative}
.arow + .arow::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.arow:active{background:var(--sunk)}
.arow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .meta{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

.empty{margin-top:26px;padding:24px 16px;border-radius:16px;background:var(--surface);text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty p{margin:0}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--sunk);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .inner{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tab{display:grid;justify-items:center;align-content:center;gap:3px;border:0;background:none;color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.02em;cursor:pointer}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}

dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:720px;max-height:calc(100% - 48px);
  border:0;padding:0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
dialog.sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .in{display:grid;gap:16px;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.grab{justify-self:center;width:38px;height:5px;border-radius:3px;background:var(--line)}
.sheethead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bigtrk{display:grid;gap:2px}
.bigtrk .n{font-family:var(--f-lcd);font-size:3.6rem;line-height:.9;color:var(--accent)}
.bigtrk .l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.done{min-height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--sunk);font-weight:600;cursor:pointer}
.sheet h2{margin:0;font-size:1.45rem;line-height:1.2;text-wrap:balance}
.sheet .by{margin:-10px 0 0;color:var(--muted)}
.facts{display:grid;gap:0;border-radius:14px;background:var(--bg);overflow:hidden}
.fact{display:grid;gap:2px;padding:10px 14px}
.fact + .fact{border-top:1px solid var(--line)}
.fact .k{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact .v{overflow-wrap:anywhere}
.fact .v.mono{font-family:var(--f-lcd);font-size:.95rem}
.actions{display:grid;gap:8px}
.action{--c:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 14px;
  border-radius:12px;border:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-weight:600}
.action .code{font-family:var(--f-display);letter-spacing:.04em;color:var(--c)}

/* skip counter */
.playing{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 2px 0 10px;border-radius:10px;background:var(--sunk);
  color:var(--muted);font-size:13px;font-weight:600;cursor:text;white-space:nowrap}
.playing svg{width:13px;height:13px;color:var(--accent)}
.playing input{width:4.2ch;min-height:32px;padding:0 4px;border:0;border-radius:7px;background:transparent;color:var(--accent);
  font:400 18px var(--f-lcd);text-align:center;-webkit-appearance:none;appearance:none}
.playing input::placeholder{color:var(--muted)}
.playing.set{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--ink)}
.playing.bad{box-shadow:inset 0 0 0 1.5px var(--bad)}
.playing.bad input{color:var(--bad)}
.skip{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:7px;background:var(--sunk);color:var(--ink);
  font-family:var(--f-lcd);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.skip svg{width:11px;height:11px;color:var(--muted)}
.skip.now{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent);font-family:var(--f-body);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.skip.now svg{color:var(--accent)}
.skipbox{display:grid;gap:10px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.sk-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sk-head .k{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.skipbox p{margin:0}
.sk-main{display:flex;align-items:center;gap:8px;font-size:1.2rem;font-weight:600}
.sk-main svg{width:22px;height:22px;color:var(--accent);flex:none}
.sk-main b{font-family:var(--f-lcd);font-weight:400;font-size:2.1rem;color:var(--accent);line-height:1}
.sk-main.now{font-size:1.05rem}
.sk-sub,.sk-ask{color:var(--muted);font-size:.92rem}
.sk-note{font-size:.85rem;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.skipbox .action{background:var(--surface)}

/* song recognition */
.listenbtn{width:38px;height:36px;border-radius:10px;border:0;background:var(--sunk);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}
.listenbtn svg{width:20px;height:20px}
.listenbtn[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.lcard{margin-top:14px;padding:14px;border-radius:16px;background:var(--surface);display:grid;gap:12px;
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.lhead .k{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lx{width:32px;height:32px;margin:-6px -6px -6px 0;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.lx svg{width:16px;height:16px}
.meter{display:flex;align-items:flex-end;gap:3px;height:20px}
.meter i{display:block;width:4px;height:20%;border-radius:2px;background:var(--accent);transition:height .1s}
.lnow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;text-align:left;border:0;background:none;padding:0;cursor:pointer;width:100%}
.lnow .n{font-family:var(--f-lcd);font-size:3rem;line-height:.9;color:var(--accent);grid-row:1 / span 2;min-width:2ch;text-align:right}
.lnow .ti{font-size:1.15rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.lnow .sub{color:var(--muted);font-size:.88rem}
.lnow .sub .file{font-family:var(--f-lcd);color:var(--c,var(--muted))}
.lmsg{margin:0;color:var(--muted);font-size:.95rem}
.lmsg b{color:var(--ink)}
.lbtns{display:flex;flex-wrap:wrap;gap:8px}
.lalt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.92rem}
.lalt .n{font-family:var(--f-lcd);color:var(--accent);font-size:1.2rem}

@media (max-width:340px){.cats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){dialog.sheet[open]{animation:none}.meter i{transition:none}}
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <div class="inner gut">
    <div class="titlerow"><h1 id="title">Songs</h1><span class="count" id="count"></span>
      <button type="button" class="listenbtn" id="listenBtn" aria-pressed="false" aria-label="Recognise the playing song" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
      <label class="playing" id="playingWrap" for="playing">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l11-7L7 5Z"></path></svg>
        <span>Playing</span>
        <input id="playing" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="–" autocomplete="off" aria-label="Track number playing now">
      </label>
    </div>
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label class="vh" for="q">Search</label>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="clear" id="qclear" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.7 12.3-1.4 1.4L12 13.4l-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3 1.4-1.4 2.3 2.3 2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3Z"></path></svg></button>
    </div>
    <div class="pills" id="pills" hidden></div>
  </div>
</header>

<main class="inner gut">
  <section class="lcard" id="listenCard" aria-live="polite" hidden></section>
  <section class="view" id="view-songs" aria-label="Songs"><div class="empty"><p>Loading songs…</p></div></section>
  <section class="view" id="view-categories" aria-label="Categories" hidden></section>
  <section class="view" id="view-artists" aria-label="Artists" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="inner gut">
    <button type="button" class="tab" data-tab="songs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
      <span>Songs</span></button>
    <button type="button" class="tab" data-tab="categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
      <span>Categories</span></button>
    <button type="button" class="tab" data-tab="artists">
